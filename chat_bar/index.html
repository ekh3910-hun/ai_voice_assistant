<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:"Noto Sans KR",system-ui,sans-serif}
.bar{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid #dfe3f4;border-radius:999px;padding:6px 7px;width:100%;height:64px;box-shadow:0 5px 20px rgba(90,93,190,.06)}
button{border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.mic{height:44px;width:44px;border-radius:50%;background:#e9edff;color:#6c75e5}
.mic.recording{background:#ffe0e8;color:#ce4464}
.plus{height:42px;width:34px;border-radius:50%;background:transparent;color:#6c75e5}
.plus:hover{background:#f0f1ff}.text{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 3px;color:#28385c;font:14px inherit}
.text::placeholder{color:#9aa4c1}.send{height:44px;width:44px;border-radius:50%;background:linear-gradient(135deg,#9087fb,#696de8);color:#fff}
.send:disabled{opacity:.6;cursor:default}
svg{width:21px;height:21px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.plus svg{width:23px;height:23px}
.time{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:#c44464;white-space:nowrap;display:none}
.time.show{display:inline}
.notice{height:18px;padding-left:13px;font-size:11px;color:#b44864;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div class="bar">
<button id="mic" class="mic" aria-label="녹음 시작" title="음성 녹음"><svg id="micIcon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg></button>
<span id="time" class="time" aria-live="polite">00:00</span>
<button id="plus" class="plus" aria-label="음성 파일 첨부" title="음성 파일 첨부"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<input id="file" type="file" accept=".wav,.mp3,.m4a,.webm,.ogg,.mp4,audio/*" hidden>
<input id="text" class="text" placeholder="메시지를 입력하세요..." aria-label="메시지 입력">
<button id="send" class="send" aria-label="전송" title="전송"><svg viewBox="0 0 24 24"><path d="m21 3-8.5 18-3.4-7.8L1 10l20-7ZM9.1 13.2 21 3"/></svg></button>
</div><div id="notice" class="notice" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const mic=$('mic'),file=$('file'),plus=$('plus'),input=$('text'),time=$('time'),notice=$('notice');
let recorder=null,stream=null,chunks=[],start=0,timer=null,recording=false;
function emit(value){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value,dataType:'json'},'*')}
function size(){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:86},'*')}
window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render')size()});
window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');size();
function error(s){notice.textContent=s||''}
function id(){return Date.now()+'-'+Math.random().toString(36).slice(2)}
function submit(){const text=input.value.trim();if(!text)return;emit({id:id(),type:'text',text});input.value='';error('')}
$('send').onclick=submit;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();submit()}});
plus.onclick=()=>file.click();
function extension(f){let ext=(f.name||'').split('.').pop().toLowerCase();return ['wav','mp3','m4a','webm','ogg','mp4'].includes(ext)?ext:'webm'}
function sendAudio(blob,source,ext){
  if(blob.size>10*1024*1024){error('10MB 이하의 음성 파일만 사용할 수 있어요.');return}
  const reader=new FileReader();
  reader.onload=()=>{const base64=String(reader.result).split(',')[1];emit({id:id(),type:'audio',source,extension:ext,data:base64});error('음성을 처리하고 있어요…')};
  reader.onerror=()=>error('파일을 읽을 수 없어요.');
  reader.readAsDataURL(blob);
}
file.onchange=()=>{const f=file.files?.[0];if(f)sendAudio(f,'file',extension(f));file.value=''};
function tick(){const sec=Math.floor((Date.now()-start)/1000);time.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function cleanup(){if(timer)clearInterval(timer);timer=null;recording=false;mic.classList.remove('recording');mic.title='음성 녹음';mic.setAttribute('aria-label','녹음 시작');$('micIcon').innerHTML='<rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/>';time.classList.remove('show');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
mic.onclick=async()=>{
  if(recording){if(recorder?.state==='recording')recorder.stop();return}
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){error('이 브라우저는 녹음을 지원하지 않아요.');return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m));
    recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
    chunks=[];
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    recorder.onstop=()=>{const type=recorder.mimeType||'audio/webm';const blob=new Blob(chunks,{type});cleanup();if(blob.size)sendAudio(blob,'record',type.includes('mp4')?'mp4':'webm')};
    recorder.onerror=()=>{cleanup();error('녹음에 실패했어요.')};
    recorder.start();recording=true;start=Date.now();time.textContent='00:00';time.classList.add('show');timer=setInterval(tick,250);
    mic.classList.add('recording');mic.title='녹음 종료';mic.setAttribute('aria-label','녹음 종료');$('micIcon').innerHTML='<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>';error('')
  }catch(e){cleanup();error('마이크 권한을 허용해 주세요.')}
};
</script></body></html>
